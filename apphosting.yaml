runConfig:
  cpu: 1
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: AI_PROVIDER
    value: gemini
    availability:
      - RUNTIME
  - variable: GEMINI_HEAVY_MODEL
    value: gemini-2.5-flash
    availability:
      - RUNTIME
  - variable: GEMINI_FAST_MODEL
    value: gemini-2.5-flash-lite
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Web App SDK config for Firebase project telehealthlms (LogiCall Pulse Web App).
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: telehealthlms
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA6hvCG42JHg3nk9-eKUd7LI_iYGIcdKFs
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: telehealthlms.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: telehealthlms.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: INITIAL_SUPER_ADMIN_EMAILS
    value: connorleavitt@logicall.io,connorl@logicall.io
    availability:
      - RUNTIME
  - variable: ALLOWED_GOOGLE_WORKSPACE_DOMAINS
    value: logicall.io,logicall.live
    availability:
      - RUNTIME
  - variable: MAX_SIM_SESSIONS_PER_USER_PER_DAY
    value: "15"
    availability:
      - RUNTIME
  # Uncomment after running: npx -y firebase-tools@latest apphosting:secrets:set GEMINI_API_KEY
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
