runConfig:
  cpu: 1
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: AI_PROVIDER
    value: gemini
    availability:
      - RUNTIME
  - variable: GEMINI_HEAVY_MODEL
    value: gemini-3.8-flash
    availability:
      - RUNTIME
  - variable: GEMINI_FAST_MODEL
    value: gemini-3.5-flash-lite
    availability:
      - RUNTIME
  # Caps Gemini "thinking" per call. Unset, 3.8 Flash spent ~74% of output tokens thinking and some Drill
  # batches ran out of output room (truncated, then retried). The cap is added on top of each call's limit.
  - variable: GEMINI_THINKING_BUDGET
    value: "1024"
    availability:
      - RUNTIME
  # Connor 2026-11-23: Gemini 4 Neon writes Tracks (planning, cards, Drills, scenarios, contradiction check);
  # Verbal Practice keeps the Flash models above. The Track-planning call gets more thinking room.
  - variable: GEMINI_BUILD_MODEL
    value: gemini-4-neon
    availability:
      - RUNTIME
  - variable: GEMINI_PLANNING_THINKING_BUDGET
    value: "8192"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Web App SDK config for Firebase project telehealthlms (LogiCall Pulse Web App).
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: telehealthlms
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA6hvCG42JHg3nk9-eKUd7LI_iYGIcdKFs
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: telehealthlms.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: telehealthlms.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: INITIAL_SUPER_ADMIN_EMAILS
    value: connorleavitt@logicall.io,connorl@logicall.io
    availability:
      - RUNTIME
  - variable: ALLOWED_GOOGLE_WORKSPACE_DOMAINS
    value: logicall.io,logicall.live
    availability:
      - RUNTIME
  - variable: MAX_SIM_SESSIONS_PER_USER_PER_DAY
    value: "15"
    availability:
      - RUNTIME
  # Background Track builds: each build runs as short Cloud Tasks steps (src/lib/services/track-build-driver.ts).
  # The queue and IAM grants must exist first; without them builds fall back to running in-process.
  - variable: TRACK_BUILD_QUEUE
    value: projects/telehealthlms/locations/us-central1/queues/track-builds
    availability:
      - RUNTIME
  - variable: TRACK_BUILD_TASK_SA
    value: firebase-app-hosting-compute@telehealthlms.iam.gserviceaccount.com
    availability:
      - RUNTIME
  # New Track builds (not Retries or resumes) one trainer can start per UTC day.
  - variable: MAX_TRACK_BUILDS_PER_USER_PER_DAY
    value: "10"
    availability:
      - RUNTIME
  # Invite emails (Resend). Links in emails use APP_BASE_URL. Sending stays off until RESEND_API_KEY exists.
  - variable: APP_BASE_URL
    value: https://logicall-pulse--telehealthlms.us-central1.hosted.app
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    value: "LogiCall Pulse <pulse@logicall.io>"
    availability:
      - RUNTIME
  # Gmail / Workspace sending: the account that owns the App Password (secret SMTP_PASSWORD in Secret Manager).
  - variable: SMTP_USER
    value: connorleavitt@logicall.io
    availability:
      - RUNTIME
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability:
      - RUNTIME
  # Resend alternative. Uncomment only after `apphosting:secrets:set RESEND_API_KEY`.
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME
  # Value lives in Cloud Secret Manager (set with apphosting:secrets:set GEMINI_API_KEY); never commit it.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
