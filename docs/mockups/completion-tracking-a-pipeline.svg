<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <defs>
    <style>
      .h1{font-size:26px;font-weight:700;fill:#0f172a}
      .h2{font-size:15px;font-weight:700;fill:#0f172a}
      .t{font-size:13px;fill:#334155}
      .n{font-size:13px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#5b6b82}
      .xs{font-size:11px;fill:#5b6b82}
      .lab{font-size:10.5px;font-weight:700;letter-spacing:1px;fill:#5b6b82}
    </style>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1e293b" flood-opacity="0.10"/></filter>
    <g id="avatar"><circle r="14" fill="#eef0fd"/></g>
  </defs>
  <rect width="1280" height="860" fill="#f6f7fb"/>

  <!-- Sidebar -->
  <rect width="220" height="860" fill="#fff"/><rect x="219" width="1" height="860" fill="#e3e8f0"/>
  <rect x="16" y="14" width="32" height="32" rx="8" fill="#eef0fd"/><path d="M22 31h5l3-8 4 14 3-6h5" stroke="#4f46e5" stroke-width="2" fill="none"/>
  <text x="58" y="34" class="h2" font-size="14">LogiCall Pulse</text>
  <text x="48" y="104" class="t">Home</text>
  <rect x="12" y="122" width="196" height="36" rx="8" fill="#f1f4f9"/><rect x="12" y="128" width="3" height="24" rx="1.5" fill="#4f46e5"/>
  <text x="48" y="145" class="n">Team Progress</text>
  <text x="48" y="186" class="t">Analytics</text>

  <!-- Header -->
