  <text x="58" y="34" class="h2" font-size="14">LogiCall Pulse</text>
  <text x="48" y="104" class="t">Home</text>
  <rect x="12" y="122" width="196" height="36" rx="8" fill="#f1f4f9"/><rect x="12" y="128" width="3" height="24" rx="1.5" fill="#4f46e5"/>
