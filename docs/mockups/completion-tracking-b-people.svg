  <circle cx="300" cy="192" r="30" fill="none" stroke="#047857" stroke-width="10" stroke-dasharray="94 189" transform="rotate(-90 300 192)"/>
  <text x="300" y="197" class="n" text-anchor="middle">50%</text>
  <text x="346" y="178" class="lab">TEAM READY FOR CALLS</text>
  <text x="346" y="202" class="h2">18 of 36 certifications</text>
  <text x="346" y="222" class="xs">+4 this week · target 80% by Nov 14</text>

  <g filter="url(#sh)"><rect x="580" y="140" width="214" height="104" rx="14" fill="#fff"/></g>
