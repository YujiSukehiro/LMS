  <text x="320" y="484" class="t"><tspan style="fill:#b45309;font-weight:700">Failed the Live Call Sim twice</tspan> (72%, pass line 80%).</text>
  <g transform="translate(820 424)">
    <text x="0" y="0" class="xs">MVP Retention</text>
    <circle cx="8" cy="20" r="7" fill="#047857"/><rect x="15" y="19" width="50" height="2" fill="#047857"/>
    <circle cx="72" cy="20" r="7" fill="#047857"/><rect x="79" y="19" width="50" height="2" fill="#047857"/>
    <circle cx="136" cy="20" r="7" fill="#047857"/><rect x="143" y="19" width="50" height="2" fill="#047857"/>
    <circle cx="200" cy="20" r="7" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
    <text x="0" y="46" class="xs">C1</text><text x="64" y="46" class="xs">C2</text><text x="128" y="46" class="xs">C3</text><text x="190" y="46" class="xs" style="fill:#b45309">Sim</text>
  </g>
  <rect x="1060" y="426" width="172" height="32" rx="8" fill="#4f46e5"/><text x="1078" y="447" class="t" style="fill:#fff;font-weight:600">Open sim transcript →</text>

  <g filter="url(#sh)"><rect x="248" y="510" width="1002" height="96" rx="12" fill="#fff"/></g>
  <rect x="248" y="510" width="4" height="96" rx="2" fill="#c81e1e"/>
  <circle cx="290" cy="548" r="18" fill="#e9f7f1"/><text x="290" y="553" class="t" text-anchor="middle" style="font-weight:700;fill:#047857">SH</text>
  <text x="320" y="542" class="n">Sofia Herrera</text><text x="320" y="560" class="xs">LC-1042 · active 2 days ago</text>
  <text x="320" y="590" class="t"><tspan style="fill:#c81e1e;font-weight:700">Needs recert:</tspan> NeuroCalmRx pricing changed (p. 4). Redo Checkpoint 3 only.</text>
