  <g filter="url(#sh)"><rect x="248" y="622" width="1002" height="44" rx="12" fill="#fff"/></g>
  <text x="268" y="649" class="n">On track · 6 agents</text><text x="420" y="649" class="s">Diego, Luis, Ana P., Mateo, Iris, Kofi — all active in the last 3 days</text><text x="1222" y="649" class="s" text-anchor="end">Show ▾</text>
  <g filter="url(#sh)"><rect x="248" y="676" width="1002" height="44" rx="12" fill="#fff"/></g>
  <text x="268" y="703" class="n">Fully ready · 3 agents</text><text x="420" y="703" class="s">Certified on every assigned Track · next expiry Jan 20</text><text x="1222" y="703" class="s" text-anchor="end">Show ▾</text>

  <text x="248" y="760" class="lab" style="fill:#4338ca">WHY THIS ONE</text>
  <text x="248" y="782" class="t">Starts from people, not a grid. It answers "who do I help today?" with the reason in one plain sentence and one button to act.</text>
  <text x="248" y="802" class="t">Each row shows only the Track that is blocking. Healthy agents are folded away. Best for supervisors coaching across many Tracks.</text>
  <text x="248" y="822" class="t">The full grid stays available as an export or an "All agents" tab.</text>
</svg>
