  <text x="826" y="208" class="h1" style="fill:#4338ca">6</text><text x="848" y="208" class="s">agents learning</text>
  <text x="826" y="230" class="xs">active in the last 3 days</text>

  <g filter="url(#sh)"><rect x="1032" y="140" width="218" height="104" rx="14" fill="#fff"/></g>
