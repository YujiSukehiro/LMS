    <path d="M200 12l7 3.5v5c0 4.5-3.5 7-7 8-3.5-1-7-3.5-7-8v-5z" fill="none" stroke="#cfd7e3" stroke-width="2"/>
    <text x="0" y="46" class="xs">C1</text><text x="64" y="46" class="xs" style="fill:#c81e1e">C2</text><text x="128" y="46" class="xs">C3</text><text x="190" y="46" class="xs">Sim</text>
  </g>
  <rect x="1060" y="320" width="172" height="32" rx="8" fill="#4f46e5"/><text x="1084" y="341" class="t" style="fill:#fff;font-weight:600">Coach: review C2 →</text>
