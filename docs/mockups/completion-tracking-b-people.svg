    <circle cx="72" cy="20" r="7" fill="#047857"/><rect x="79" y="19" width="50" height="2" fill="#047857"/>
    <circle cx="136" cy="20" r="7" fill="#fff" stroke="#c81e1e" stroke-width="2.5"/><rect x="143" y="19" width="50" height="2" fill="#e3e8f0"/>
    <path d="M200 12l7 3.5v5c0 4.5-3.5 7-7 8-3.5-1-7-3.5-7-8v-5z" fill="#047857" opacity="0.35"/>
    <text x="0" y="46" class="xs">C1</text><text x="64" y="46" class="xs">C2</text><text x="128" y="46" class="xs" style="fill:#c81e1e">C3</text><text x="190" y="46" class="xs">Cert</text>
  </g>
  <rect x="1060" y="532" width="172" height="32" rx="8" fill="#fff" stroke="#cfd7e3"/><text x="1086" y="553" class="t" style="font-weight:600">See what changed</text>

