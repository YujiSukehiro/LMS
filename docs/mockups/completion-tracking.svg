  <text x="292" y="546" class="t" font-weight="600" style="fill:#0f172a">Sofia Herrera</text><text x="292" y="563" class="xs mono">LC-1042 · active 2 days ago</text>
  <rect x="520" y="532" width="120" height="24" rx="12" fill="#fef2f2" stroke="#f5c2c2"/><text x="532" y="548" class="s" style="fill:#c81e1e" font-weight="600">Needs recert</text>
  <text x="520" y="574" class="xs">Was certified v1 · Playbook p. 4 changed</text>
  <rect x="760" y="532" width="104" height="24" rx="12" fill="#ecfdf5" stroke="#a7e3c9"/><text x="772" y="548" class="s" style="fill:#047857" font-weight="600">Certified</text>
  <text x="760" y="574" class="xs">92% sim · valid to Feb 3</text>
  <text x="1000" y="546" class="s">Redo <tspan fill="#0f172a" font-weight="600">Checkpoint 2</tspan> only</text>
