  <g><rect x="520" y="474" width="58" height="8" rx="2" fill="#4f46e5"/><rect x="581" y="474" width="58" height="8" rx="2" fill="#4f46e5"/><rect x="642" y="474" width="58" height="8" rx="2" fill="#4f46e5"/></g><circle cx="716" cy="478" r="6" fill="none" stroke="#4f46e5" stroke-width="2"/>
