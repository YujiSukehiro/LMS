  <!-- Row 4 -->
  <text x="292" y="620" class="t" font-weight="600" style="fill:#0f172a">Marco Vega</text><text x="292" y="637" class="xs mono">LC-1045 · deactivated</text>
  <text x="520" y="624" class="s" style="fill:#94a3b8">Archived (offboarded)</text>
  <text x="760" y="624" class="s" style="fill:#94a3b8">Archived (offboarded)</text>
  <text x="1000" y="624" class="s" style="fill:#94a3b8">—</text>
  <rect x="292" y="652" width="936" height="1" fill="#eef1f5"/>

  <!-- Detail popover -->
  <g filter="url(#sh)">
    <rect x="560" y="584" width="300" height="0" fill="none"/>
  </g>
  <text x="292" y="690" class="xs">Every status comes from server-verified evidence. Demo replay and unverified history never count toward a status.</text>
  <text x="292" y="708" class="xs">Partial bars = checkpoints. The ring = the capstone sim. Shield = certified on the current Track version.</text>

  <!-- Annotations -->
  <g>
    <rect x="272" y="746" width="976" height="132" rx="14" fill="#eef0fd" stroke="#c7cbf7"/>
    <text x="292" y="772" class="lab" style="fill:#4338ca">WHAT CHANGES FROM TODAY</text>
    <text x="292" y="796" class="t">1. One five-step status ladder replaces "In Progress (75%)", "Historical — Unverified", and a separate mastery "–". Same words for agents and supervisors.</text>
    <text x="292" y="818" class="t">2. Segmented bars show which checkpoint is missing (unit counts vary per Track now), not only a percent.</text>
    <text x="292" y="840" class="t">3. "Needs recert" names the changed Playbook page and the one checkpoint to redo, instead of resetting the whole Track.</text>
    <text x="292" y="862" class="t">4. Stalled agents (no activity 7+ days) surface first with a one-click reminder; a "Next step" column tells the supervisor what to coach.</text>
  </g>
</svg>
