  <text x="760" y="440" class="xs">Learning · 2 of 9 · <tspan fill="#c81e1e" font-weight="600">stalled 9 days</tspan></text>
  <rect x="1000" y="410" width="110" height="26" rx="13" fill="#eef0fd"/><text x="1014" y="427" class="s" style="fill:#4338ca" font-weight="600">Send reminder</text>
  <rect x="292" y="456" width="936" height="1" fill="#eef1f5"/>

