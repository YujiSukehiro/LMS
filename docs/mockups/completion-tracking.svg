  <g><rect x="760" y="474" width="18" height="8" rx="2" fill="#b45309"/><rect x="781" y="474" width="18" height="8" rx="2" fill="#b45309"/><rect x="802" y="474" width="18" height="8" rx="2" fill="#b45309"/><rect x="823" y="474" width="18" height="8" rx="2" fill="#b45309"/><rect x="844" y="474" width="18" height="8" rx="2" fill="#b45309"/><rect x="865" y="474" width="18" height="8" rx="2" fill="#e3e8f0"/><rect x="886" y="474" width="18" height="8" rx="2" fill="#e3e8f0"/><rect x="907" y="474" width="18" height="8" rx="2" fill="#e3e8f0"/><rect x="928" y="474" width="18" height="8" rx="2" fill="#e3e8f0"/></g>
  <text x="760" y="500" class="xs">Learning · 5 of 9</text>
