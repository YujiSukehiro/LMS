  <rect x="394" y="15" width="140" height="26" rx="13" fill="#eef0fd" stroke="#c7cbf7"/><text x="408" y="32" class="s" style="fill:#4338ca" font-weight="600">Partner Supervisor</text>
  <circle cx="1130" cy="28" r="15" fill="#f1f4f9" stroke="#cfd7e3"/><text x="1121" y="32" class="xs" font-weight="700" style="fill:#334155">LM</text>
