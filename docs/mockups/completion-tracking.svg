  <!-- Board -->
  <g filter="url(#sh)"><rect x="272" y="306" width="976" height="420" rx="14" fill="#fff" stroke="#e3e8f0"/></g>
  <text x="292" y="336" class="h2">Agents × Tracks</text>
  <rect x="868" y="318" width="160" height="30" rx="8" fill="#f1f4f9" stroke="#cfd7e3"/><text x="882" y="338" class="s">Sort: least ready first</text>
  <rect x="1036" y="318" width="192" height="30" rx="8" fill="#f1f4f9" stroke="#cfd7e3"/><text x="1050" y="338" class="s">Filter: Telehealth, Inbound</text>

  <text x="292" y="378" class="lab">AGENT</text>
  <text x="520" y="372" class="lab">MVP RETENTION v2</text><text x="520" y="386" class="xs">3 checkpoints + 1 sim</text>
  <text x="760" y="372" class="lab">NEUROCALMRX v1</text><text x="760" y="386" class="xs">9 checkpoints + 2 sims</text>
  <text x="1000" y="372" class="lab">NEXT STEP</text>
