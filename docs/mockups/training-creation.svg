  <rect x="292" y="520" width="260" height="104" rx="10" fill="#eef0fd" stroke="#c7cbf7"/>
  <text x="306" y="544" class="lab" style="fill:#4338ca">RECOMMENDED SIZE</text>
  <text x="306" y="572" class="h2" font-size="20" style="fill:#4338ca">9 checkpoints</text>
  <text x="306" y="592" class="s">range 7–11 · about 62 minutes</text>
  <text x="306" y="610" class="s">2–8 cards and 4–10 drills each</text>

  <text x="292" y="652" class="t" font-weight="600" style="fill:#0f172a">Why not a fixed 4–5?</text>
  <text x="292" y="672" class="xs">Dense pages (2–5) get their own checkpoint.</text>
  <text x="292" y="688" class="xs">Light pages (9–13) share one. A 2-page flyer</text>
  <text x="292" y="704" class="xs">gets 2 checkpoints; a 22-page SOP gets 12.</text>
  <text x="292" y="732" class="note" font-size="12" style="fill:#4338ca" font-weight="600">Adjust target:  − 9 +</text>

