    <rect x="980" y="452" width="110" height="8" rx="4" fill="#eef1f5"/><rect x="980" y="452" width="70" height="8" rx="4" fill="#4f46e5"/><text x="1110" y="460" class="s mono">6 · 8</text>
    <rect x="608" y="472" width="620" height="1" fill="#eef1f5"/>

    <text x="612" y="498" class="s mono">6</text><text x="636" y="498" class="t" style="fill:#0f172a" font-weight="600">Checkout-abandon stage</text><text x="900" y="498" class="s mono">7–8</text>
