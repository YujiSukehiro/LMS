  <g filter="url(#sh)"><rect x="588" y="192" width="660" height="560" rx="14" fill="#fff" stroke="#e3e8f0"/></g>
  <text x="608" y="220" class="h2">Proposed checkpoints</text>
  <text x="608" y="240" class="s">Drag to reorder. Merge or split before the build. Sizes update from the pages each one covers.</text>

