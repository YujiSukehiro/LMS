  <rect x="1048" y="692" width="180" height="40" rx="10" fill="#4f46e5"/><text x="1066" y="717" class="t" font-weight="600" style="fill:#fff">Build 9 checkpoints →</text>

  <!-- Annotations -->
  <rect x="272" y="772" width="976" height="170" rx="14" fill="#eef0fd" stroke="#c7cbf7"/>
  <text x="292" y="798" class="lab" style="fill:#4338ca">WHAT CHANGES FROM TODAY</text>
  <text x="292" y="822" class="t">1. Today: three inputs, then the model picks units with no preview. Proposed: a four-step flow with a "Content map" checkpoint before any long AI build.</text>
  <text x="292" y="844" class="t">2. The map shows the measured depth (implemented now in content-depth.ts) so trainers see why a Track gets 2 or 12 checkpoints and can nudge it.</text>
  <text x="292" y="866" class="t">3. Per-checkpoint cards/drills come from the rules on its pages. Split and merge hints flag outliers before generation, not after.</text>
  <text x="292" y="888" class="t">4. Source gaps (image-only pages, conflicts) are flagged here and link straight to Source Review, instead of failing late in the build.</text>
  <text x="292" y="910" class="t">5. Step 1 accepts several PDFs plus shared rule packs (the backend already supports bundles; today's form takes one file).</text>
</svg>
